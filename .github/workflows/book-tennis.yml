name: Tennis booking

# Triggered at 7:50 Paris time on Wednesdays (books the next Tuesday, J+6) by cron-job.org through the GitHub API.
# GitHub's own schedule is not used: it can start hours late or not at all.
# To pause the bot, disable this workflow in the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-once:
    name: Run script at 08:00 Europe/Paris
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create config.json from variables
        env:
          CONFIG_JSON: ${{ vars.CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_JSON:-}" ]; then
            printf "%s" "$CONFIG_JSON" > config.json
            echo "config.json created from CONFIG_JSON secret"
          else
            echo "ERROR: Missing CONFIG_JSON secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --production --ignore-scripts

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser (only-shell)
        run: npx playwright install chromium --only-shell

      - name: Wait 08:00 Europe/Paris
        env:
          WAIT_TARGET: '07:59:30'
        run: npm run wait

      - name: Run script
        env:
          ACCOUNT_EMAIL: ${{ secrets.ACCOUNT_EMAIL }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_DOMAIN: ${{ secrets.NTFY_DOMAIN }}
          WAIT_8AM: '1'
        run: |
          set -o pipefail
          npm start 2>&1 | tee run.log

      - name: Log summary
        if: always()
        run: |
          [ -f run.log ] || exit 0
          s=$(grep -E ' - ' run.log | sed -E 's/^[0-9-]+T([0-9:.]+)[+-][0-9:]+ - /\1 /' | tail -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Resume du run::$s"

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: img/
          if-no-files-found: ignore
